openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: publish
    description: Deploy mini-site to Vercel and push to GitHub
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /publish:
    post:
      operationId: publishSite
      tags: [publish]
      summary: Deploy mini-site to Vercel and push to GitHub
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishRequest"
      responses:
        "200":
          description: Site deployed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishResult"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishError"
        "502":
          description: Vercel deployment failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PublishRequest:
      type: object
      properties:
        youtubeUrl:
          type: string
        adsenseId:
          type: string
        domainType:
          type: string
          enum: [subdomain, custom]
        subdomainName:
          type: string
        customDomain:
          type: string
      required:
        - youtubeUrl
        - adsenseId
        - domainType
    PublishResult:
      type: object
      properties:
        url:
          type: string
        githubCommitUrl:
          type: string
          nullable: true
        status:
          type: string
      required:
        - url
        - status
    PublishError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
